name: Testes Java e PostgreSQL
on: [push, pull_request]
permissions:
  contents: read
jobs:
  testes:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: todo
          POSTGRES_USER: todo
          POSTGRES_PASSWORD: todo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U todo -d todo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'
          cache: maven
      - name: Testes com H2
        run: bash mvnw -B -ntp test
      - name: Testes de integracao com PostgreSQL
        run: >-
          bash mvnw -B -ntp
          -Dspring.datasource.url=jdbc:postgresql://localhost:5432/todo
          -Dspring.datasource.driver-class-name=org.postgresql.Driver
          -Dspring.datasource.username=todo
          -Dspring.datasource.password=todo
          test
